[package]
name = "stellarsorter"
version = "0.1.0"
edition = "2021"
publish = false
description = "StellarSorter — Milestone-based recruiter fee escrow on Stellar Soroban"
authors = ["StellarSorter Team"]

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
